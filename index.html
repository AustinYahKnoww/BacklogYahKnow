<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Backlog — Game Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181F;
    --paper:#ECE3CC;
    --paper-line:rgba(20,24,31,0.14);
    --gold:#C9A227;
    --amber:#C9862B;
    --green:#3F7D5C;
    --red:#B23A3A;
    --slate:#4C5B73;
    --ps5:#2E5FA3;
    --switch:#C1443A;
    --xbox:#3E8C4A;
    --pc:#6C6C6C;
    --retro:#C9A227;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    min-height:100vh;
    font-family:'Space Grotesk', system-ui, sans-serif;
    color:var(--paper);
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  .wrap{max-width:1000px;margin:0 auto;padding:40px 20px 100px;}
  header{margin-bottom:32px;}
  .eyebrow{font-size:11px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
  h1{font-size:34px;font-weight:700;margin:0;color:var(--paper);}
  .sub{color:rgba(236,227,204,0.5);font-size:14px;margin-top:6px;}

  .pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
  .pill{
    font-size:11px;text-transform:uppercase;letter-spacing:0.04em;
    border-radius:999px;padding:6px 12px;border:1px solid;
    background:transparent;cursor:pointer;transition:transform .1s ease;
  }
  .pill:hover{transform:translateY(-1px);}
  .pill.all-active{background:var(--paper);color:var(--ink);border-color:transparent;}
  .pill.all{border-color:rgba(236,227,204,0.2);color:var(--paper);}

  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:24px;}
  .search-box{position:relative;flex:1;min-width:200px;}
  .search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4;}
  input,select,textarea{
    font-family:'Space Grotesk', sans-serif;
    border:1px solid var(--paper-line);
    border-radius:3px;
    padding:9px 12px;
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  .search-box input{width:100%;padding-left:34px;background:var(--paper);}
  select.platform-filter{background:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;text-transform:uppercase;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border-radius:3px;padding:9px 14px;font-size:14px;font-weight:500;
    border:1px solid transparent;cursor:pointer;font-family:'Space Grotesk',sans-serif;
    white-space:nowrap;
  }
  .btn-ghost{background:transparent;border-color:rgba(236,227,204,0.35);color:var(--paper);}
  .btn-amber{background:var(--amber);color:var(--ink);font-weight:600;}
  .btn-ink{background:var(--ink);color:#fff;}
  .btn-outline{background:transparent;border:1px solid rgba(20,24,31,0.2);color:var(--ink);}

  .error-msg{color:var(--red);font-size:12px;margin-bottom:16px;}
  .empty{
    color:rgba(236,227,204,0.5);font-size:14px;
    border:1px dashed rgba(236,227,204,0.2);border-radius:3px;
    padding:40px;text-align:center;
  }

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px,1fr));gap:24px;padding-top:8px;}

  .card{
    position:relative;text-align:left;width:100%;border-radius:3px;overflow:hidden;
    background:var(--paper);border:1px solid var(--paper-line);
    box-shadow:3px 4px 0 rgba(20,24,31,0.18);
    cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;
    padding:0;font-family:'Space Grotesk',sans-serif;
  }
  .card:hover{transform:translateY(-3px);box-shadow:4px 6px 0 rgba(20,24,31,0.22);}
  .card-body{position:relative;padding:16px 16px 20px;}
  .callnum{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;color:rgba(20,24,31,0.5);margin-bottom:8px;}
  .stamp{
    position:absolute;top:12px;right:12px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:.12em;
    border:2px solid;border-radius:4px;padding:2px 8px;
    transform:rotate(-7deg);pointer-events:none;
  }
  .card-title{font-size:18px;font-weight:700;color:var(--ink);line-height:1.3;padding-right:70px;word-break:break-word;}
  .card-sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:rgba(20,24,31,0.5);margin-top:4px;}
  .card-plat{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .dot{width:8px;height:8px;border-radius:50%;}
  .card-plat span{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:rgba(20,24,31,0.6);}
  .card-notes{font-size:12px;color:rgba(20,24,31,0.55);margin-top:8px;font-style:italic;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,16,0.65);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal{
    background:var(--paper);border-radius:4px;padding:20px;
    width:100%;max-width:440px;max-height:90vh;overflow-y:auto;
    font-family:'Space Grotesk',sans-serif;color:var(--ink);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-head h2{font-size:20px;margin:0;}
  .close-x{background:none;border:none;cursor:pointer;color:rgba(20,24,31,0.5);padding:4px;}
  .close-x:hover{color:var(--ink);}
  label.field-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:rgba(20,24,31,0.5);display:block;margin-bottom:4px;}
  .full{width:100%;}
  .mb3{margin-bottom:12px;}
  .mb4{margin-bottom:16px;}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.03em;
    border:1px solid;border-radius:999px;padding:5px 12px;background:transparent;cursor:pointer;color:var(--ink);
  }
  textarea{resize:none;width:100%;}
  .form-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;}
  .delete-link{background:none;border:none;color:var(--red);display:flex;align-items:center;gap:5px;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:14px;padding:0;}

  .gamesearch{margin-bottom:16px;position:relative;}
  .gs-input-wrap{position:relative;}
  .gs-input-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.4;}
  .gs-input{width:100%;padding-left:32px;background:#fff;}
  .gs-results{
    margin-top:6px;border:1px solid var(--paper-line);border-radius:3px;
    background:#fff;max-height:220px;overflow-y:auto;
  }
  .gs-result{
    width:100%;display:flex;align-items:center;gap:10px;
    padding:8px 10px;text-align:left;background:none;border:none;border-bottom:1px solid var(--paper-line);
    cursor:pointer;font-family:'Space Grotesk',sans-serif;
  }
  .gs-result:last-child{border-bottom:none;}
  .gs-result:hover{background:rgba(20,24,31,0.04);}
  .gs-swatch{width:34px;height:34px;border-radius:3px;flex-shrink:0;}
  .gs-name{font-size:13px;font-weight:500;color:var(--ink);}
  .gs-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(20,24,31,0.45);}
  .gs-hint{font-size:10px;color:rgba(20,24,31,0.4);margin-top:6px;}

  .random-modal{text-align:center;padding:8px 0;}
  .random-label{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:rgba(20,24,31,0.5);margin-bottom:10px;}
  .random-title{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .random-plat{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px;}
  .random-actions{display:flex;gap:8px;justify-content:center;}

  .sync-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    border:1px solid rgba(236,227,204,0.3);border-radius:999px;padding:6px 12px;
    background:transparent;color:var(--paper);cursor:pointer;margin-top:14px;
  }
  .sync-pill .dot-live{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .sync-section{margin-bottom:18px;}
  .sync-section:last-child{margin-bottom:0;}
  .sync-code-box{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:#fff;border:1px solid var(--paper-line);border-radius:3px;
    padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.05em;
  }
  .copy-btn{background:none;border:none;cursor:pointer;color:var(--ink);opacity:.6;padding:2px;}
  .copy-btn:hover{opacity:1;}
  .sync-status{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:8px;}
  .sync-status.ok{color:var(--green);}
  .sync-status.err{color:var(--red);}
  .sync-status.pending{color:rgba(20,24,31,0.5);}
  .sync-hint{font-size:12px;color:rgba(20,24,31,0.55);margin-top:6px;line-height:1.4;}
  .sync-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:rgba(20,24,31,0.35);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;}
  .sync-divider::before,.sync-divider::after{content:"";flex:1;height:1px;background:rgba(20,24,31,0.12);}
  .sync-row{display:flex;gap:8px;}
  .sync-row input{flex:1;}

  .hidden{display:none !important;}

  @media (max-width:600px){
    .overlay{align-items:flex-end;padding:0;}
    .modal{max-width:none;border-radius:16px 16px 0 0;max-height:88vh;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow mono">Card Catalog · Local &amp; offline</div>
    <h1>The Backlog</h1>
    <p class="sub">Every game you meant to get to, filed and cross-referenced.</p>
    <button class="sync-pill" id="syncPillBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      <span id="syncPillLabel">Sync across devices</span>
    </button>
  </header>

  <div class="pillrow" id="statusPills"></div>

  <div class="toolbar">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#14181F" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="Search the catalog…">
    </div>
    <select id="platformFilter" class="platform-filter">
      <option value="All">All platforms</option>
      <option value="PS5">PS5</option>
      <option value="Switch">Switch</option>
      <option value="Xbox">Xbox</option>
      <option value="PC">PC</option>
      <option value="Retro">Retro</option>
    </select>
    <button class="btn btn-ghost" id="shuffleBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 4 3 3-3 3"/><path d="M2 7h4.5a4 4 0 0 1 3.5 2"/><path d="m18 20 3-3-3-3"/><path d="M2 17h4.5a4 4 0 0 0 3.5-2"/><path d="M13.5 9a4 4 0 0 1 3.5-2H21"/><path d="M13.5 15a4 4 0 0 0 3.5 2H21"/></svg>
      Pull a card
    </button>
    <button class="btn btn-amber" id="addBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      File a card
    </button>
  </div>

  <div class="error-msg hidden" id="errorMsg"></div>

  <div id="gridArea"></div>
</div>

<!-- Add/Edit Modal -->
<div class="overlay hidden" id="formOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="formTitle">File a new card</h2>
      <button class="close-x" id="formClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="gamesearch">
      <div class="gs-input-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#14181F" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="gsInput" class="gs-input" placeholder="Search known titles…">
      </div>
      <div id="gsResults" class="gs-results hidden"></div>
      <div class="gs-hint">Pulls from a built-in list of popular titles — works offline. Can't find it? Just type the title below.</div>
    </div>

    <label class="field-label">Title</label>
    <input id="titleInput" class="full mb3" placeholder="e.g. Elden Ring">

    <label class="field-label">Platform</label>
    <div class="chiprow mb3" id="platformChips"></div>

    <div id="subPlatformWrap" class="hidden">
      <label class="field-label">System</label>
      <input id="subPlatformInput" class="full mb3" placeholder="e.g. SNES, PS1, N64">
    </div>

    <label class="field-label">Status</label>
    <div class="chiprow mb3" id="statusChips"></div>

    <label class="field-label">Cover image URL (optional)</label>
    <input id="coverInput" class="full mb3" placeholder="https://…">

    <label class="field-label">Notes</label>
    <textarea id="notesInput" class="mb4" rows="2" placeholder="Optional — why it's on the shelf"></textarea>

    <div class="form-actions">
      <button class="delete-link hidden" id="deleteBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        Delete
      </button>
      <div style="flex:1"></div>
      <button class="btn btn-outline" id="cancelBtn">Cancel</button>
      <button class="btn btn-ink" id="saveBtn">File card</button>
    </div>
  </div>
</div>

<!-- Random pick Modal -->
<div class="overlay hidden" id="randomOverlay">
  <div class="modal random-modal">
    <div class="random-label">Tonight's pick</div>
    <div class="random-title" id="randomTitle"></div>
    <div class="random-plat">
      <span class="dot" id="randomDot"></span>
      <span class="mono" id="randomPlat" style="font-size:11px;text-transform:uppercase;color:rgba(20,24,31,.6);"></span>
    </div>
    <div class="random-actions">
      <button class="btn btn-outline" id="pullAgainBtn">Pull again</button>
      <button class="btn btn-ink" id="closeRandomBtn">Close</button>
    </div>
  </div>
</div>

<!-- Sync Modal -->
<div class="overlay hidden" id="syncOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2>Sync across devices</h2>
      <button class="close-x" id="syncClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="syncBody"></div>
  </div>
</div>

function loadGames(){

  }
}
function saveGames(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
    hideError();
  }catch(e){
    showError("Couldn't save — your changes may not persist.");
  }
  if (syncCode) cloudPush();
}
function showError(msg){
  const el = document.getElementById("errorMsg");
  el.textContent = msg; el.classList.remove("hidden");
}
function hideError(){ document.getElementById("errorMsg").classList.add("hidden"); }

// ---------- helpers ----------
function uid(){ return Math.random().toString(36).slice(2,10); }
function callNumber(platform, index){
  const prefix = {PS5:"PS5",Switch:"SW",Xbox:"XB",PC:"PC",Retro:"RX"}[platform] || "GM";
  return prefix + "-" + String(index+1).padStart(3,"0");
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- rendering ----------
function renderPills(){
  const wrap = document.getElementById("statusPills");
  const counts = {};
  STATUSES.forEach(s => counts[s] = games.filter(g => g.status === s).length);
  let html = `<button class="pill ${statusFilter==='All' ? 'all-active':'all'} mono" data-status="All">All · ${games.length}</button>`;
  STATUSES.forEach(s => {
    const active = statusFilter === s;
    html += `<button class="pill mono" data-status="${s}" style="border-color:${STATUS_COLOR[s]};color:${active?'#fff':STATUS_COLOR[s]};background:${active?STATUS_COLOR[s]:'transparent'}">${s} · ${counts[s]}</button>`;
  });
  wrap.innerHTML = html;
  wrap.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      const s = btn.dataset.status;
      statusFilter = (statusFilter === s) ? "All" : s;
      if (s === "All") statusFilter = "All";
      renderAll();
    });
  });
}

function filteredGames(){
  return games.filter(g => {
    if (platformFilter !== "All" && g.platform !== platformFilter) return false;
    if (statusFilter !== "All" && g.status !== statusFilter) return false;
    if (searchTerm && !g.title.toLowerCase().includes(searchTerm.toLowerCase())) return false;
    return true;
  });
}

function renderGrid(){
  const area = document.getElementById("gridArea");
  const list = filteredGames();
  if (games.length === 0){
    area.innerHTML = `<div class="empty">Catalog's empty. File your first card to start the shelf.</div>`;
    return;
  }
  if (list.length === 0){
    area.innerHTML = `<div class="empty">No cards match this search.</div>`;
    return;
  }
  let html = `<div class="grid">`;
  list.forEach((g, i) => {
    const idx = games.findIndex(x => x.id === g.id);
    const tilt = (i % 3) - 1;
    html += `
      <div class="card" style="transform:rotate(${tilt}deg)" data-id="${g.id}">
        ${g.cover ? `<div style="height:96px;overflow:hidden;border-bottom:1px solid var(--paper-line)"><img src="${esc(g.cover)}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.style.display='none'"></div>` : ""}
        <div class="card-body">
          <div class="callnum mono">${callNumber(g.platform, idx)}</div>
          <div class="stamp mono" style="color:${STATUS_COLOR[g.status]};border-color:${STATUS_COLOR[g.status]}">${g.status}</div>
          <div class="card-title">${esc(g.title)}</div>
          ${g.subPlatform ? `<div class="card-sub">${esc(g.subPlatform)}</div>` : ""}
          <div class="card-plat">
            <span class="dot" style="background:${PLATFORM_COLOR[g.platform]}"></span>
            <span>${g.platform}</span>
          </div>
          ${g.notes ? `<div class="card-notes">"${esc(g.notes)}"</div>` : ""}
        </div>
      </div>`;
  });
  html += `</div>`;
  area.innerHTML = html;
  area.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openForm(games.find(g => g.id === card.dataset.id)));
  });
}

function renderAll(){
  renderPills();
  renderGrid();
}

// ---------- form modal ----------
let formPlatform = "PS5";
let formStatus = "Backlog";

function renderChips(){
  const pWrap = document.getElementById("platformChips");
  pWrap.innerHTML = PLATFORMS.map(p => {
    const active = formPlatform === p;
    return `<button type="button" class="chip" data-platform="${p}" style="border-color:${PLATFORM_COLOR[p]};color:${active?'#fff':'#14181F'};background:${active?PLATFORM_COLOR[p]:'transparent'}">${p}</button>`;
  }).join("");
  pWrap.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => { formPlatform = btn.dataset.platform; renderChips(); toggleSubPlatform(); });
  });

  const sWrap = document.getElementById("statusChips");
  sWrap.innerHTML = STATUSES.map(s => {
    const active = formStatus === s;
    return `<button type="button" class="chip" data-status="${s}" style="border-color:${STATUS_COLOR[s]};color:${active?'#fff':'#14181F'};background:${active?STATUS_COLOR[s]:'transparent'}">${s}</button>`;
  }).join("");
  sWrap.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => { formStatus = btn.dataset.status; renderChips(); });
  });

  toggleSubPlatform();
}
function toggleSubPlatform(){
  document.getElementById("subPlatformWrap").classList.toggle("hidden", formPlatform !== "Retro");
}

function openForm(game){
  editingId = game ? game.id : null;
  document.getElementById("formTitle").textContent = game ? "Edit card" : "File a new card";
  document.getElementById("titleInput").value = game ? game.title : "";
  document.getElementById("subPlatformInput").value = game ? (game.subPlatform || "") : "";
  document.getElementById("coverInput").value = game ? (game.cover || "") : "";
  document.getElementById("notesInput").value = game ? (game.notes || "") : "";
  formPlatform = game ? game.platform : "PS5";
  formStatus = game ? game.status : "Backlog";
  document.getElementById("deleteBtn").classList.toggle("hidden", !game);
  document.getElementById("saveBtn").textContent = game ? "Save" : "File card";
  document.getElementById("gsInput").value = "";
  document.getElementById("gsResults").classList.add("hidden");
  renderChips();
  document.getElementById("formOverlay").classList.remove("hidden");
}
function closeForm(){
  document.getElementById("formOverlay").classList.add("hidden");
  editingId = null;
}

function saveForm(){
  const title = document.getElementById("titleInput").value.trim();
  if (!title) return;
  const subPlatform = document.getElementById("subPlatformInput").value.trim();
  const cover = document.getElementById("coverInput").value.trim();
  const notes = document.getElementById("notesInput").value.trim();

  if (editingId){
    const g = games.find(x => x.id === editingId);
    Object.assign(g, {title, platform: formPlatform, subPlatform, status: formStatus, cover, notes});
  } else {
    games.unshift({
      id: uid(), title, platform: formPlatform, subPlatform,
      status: formStatus, cover, notes, added: new Date().toISOString()
    });
  }
  saveGames();
  closeForm();
  renderAll();
}

function deleteCurrent(){
  if (!editingId) return;
  games = games.filter(g => g.id !== editingId);
  saveGames();
  closeForm();
  renderAll();
}

// ---------- built-in title search ----------
function runGameSearch(query){
  const resultsEl = document.getElementById("gsResults");
  const q = query.trim().toLowerCase();
  if (q.length < 2){
    resultsEl.classList.add("hidden");
    resultsEl.innerHTML = "";
    return;
  }
  const matches = GAME_DB.filter(g => g.t.toLowerCase().includes(q)).slice(0, 8);
  if (matches.length === 0){
    resultsEl.classList.add("hidden");
    resultsEl.innerHTML = "";
    return;
  }
  resultsEl.innerHTML = matches.map((m, i) => `
    <button type="button" class="gs-result" data-idx="${i}">
      <div class="gs-swatch" style="background:${PLATFORM_COLOR[m.p]}"></div>
      <div>
        <div class="gs-name">${esc(m.t)}</div>
        <div class="gs-meta">${m.y || "—"} · ${m.p}${m.s ? " · " + m.s : ""}</div>
      </div>
    </button>`).join("");
  resultsEl.classList.remove("hidden");
  resultsEl.querySelectorAll(".gs-result").forEach(btn => {
    btn.addEventListener("click", () => {
      const m = matches[Number(btn.dataset.idx)];
      document.getElementById("titleInput").value = m.t;
      formPlatform = m.p;
      renderChips();
      if (m.s) document.getElementById("subPlatformInput").value = m.s;
      document.getElementById("gsInput").value = "";
      resultsEl.classList.add("hidden");
      resultsEl.innerHTML = "";
    });
  });
}

// ---------- random pick ----------
function pickRandom(){
  const pool = games.filter(g => g.status === "Backlog");
  if (pool.length === 0){
    closeForm();
    return;
  }
  const g = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById("randomTitle").textContent = g.title;
  document.getElementById("randomDot").style.background = PLATFORM_COLOR[g.platform];
  document.getElementById("randomPlat").textContent = g.platform + (g.subPlatform ? " · " + g.subPlatform : "");
  document.getElementById("randomOverlay").classList.remove("hidden");
}

// ---------- cross-device sync (kvdb.io) ----------
function randomEmail(){
  return "backlog-" + Math.random().toString(36).slice(2, 10) + "@example.com";
}

async function cloudCreateAndConnect(){
  setSyncStatus("pending", "Creating your code…");
  try{
    const res = await fetch(KVDB_BASE + "/", {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: "email=" + encodeURIComponent(randomEmail())
    });
    if (!res.ok) throw new Error("create failed");
    const bucketId = (await res.text()).trim();
    if (!bucketId) throw new Error("no id returned");
    syncCode = bucketId;
    localStorage.setItem(SYNC_KEY, syncCode);
    await cloudPush();
    renderSyncModal();
    updateSyncPill();
  }catch(e){
    setSyncStatus("err", "Couldn't reach the sync service. Check your connection and try again.");
  }
}

async function cloudConnectExisting(code){
  const trimmed = code.trim();
  if (!trimmed) return;
  setSyncStatus("pending", "Looking up that code…");
  try{
    const res = await fetch(`${KVDB_BASE}/${encodeURIComponent(trimmed)}/games`);
    if (res.status === 404){
      setSyncStatus("err", "No list found for that code. Double-check it and try again.");
      return;
    }
    if (!res.ok) throw new Error("fetch failed");
    const text = await res.text();
    const remoteGames = text ? JSON.parse(text) : [];
    games = Array.isArray(remoteGames) ? remoteGames : [];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
    syncCode = trimmed;
    localStorage.setItem(SYNC_KEY, syncCode);
    renderAll();
    renderSyncModal();
    updateSyncPill();
  }catch(e){
    setSyncStatus("err", "Couldn't reach the sync service. Check your connection and try again.");
  }
}

async function cloudPush(){
  if (!syncCode) return;
  setSyncStatus("pending", "Syncing…");
  try{
    const res = await fetch(`${KVDB_BASE}/${encodeURIComponent(syncCode)}/games`, {
      method: "PUT",
      headers: {"Content-Type": "text/plain"},
      body: JSON.stringify(games)
    });
    if (!res.ok) throw new Error("push failed");
    setSyncStatus("ok", "Synced");
  }catch(e){
    setSyncStatus("err", "Sync failed — saved locally only.");
  }
}

async function cloudRefresh(){
  if (!syncCode) return;
  setSyncStatus("pending", "Refreshing from cloud…");
  try{
    const res = await fetch(`${KVDB_BASE}/${encodeURIComponent(syncCode)}/games`);
    if (!res.ok) throw new Error("refresh failed");
    const text = await res.text();
    const remoteGames = text ? JSON.parse(text) : [];
    games = Array.isArray(remoteGames) ? remoteGames : [];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
    renderAll();
    setSyncStatus("ok", "Up to date");
  }catch(e){
    setSyncStatus("err", "Couldn't refresh — check your connection.");
  }
}

function disconnectSync(){
  syncCode = "";
  localStorage.removeItem(SYNC_KEY);
  renderSyncModal();
  updateSyncPill();
}

function setSyncStatus(kind, msg){
  const el = document.getElementById("syncStatusMsg");
  if (!el) return;
  el.textContent = msg;
  el.className = "sync-status " + kind;
}

function updateSyncPill(){
  const label = document.getElementById("syncPillLabel");
  label.textContent = syncCode ? "Synced · " + syncCode.slice(0, 6) + "…" : "Sync across devices";
}

function renderSyncModal(){
  const body = document.getElementById("syncBody");
  if (syncCode){
    body.innerHTML = `
      <div class="sync-section">
        <label class="field-label">Your sync code</label>
        <div class="sync-code-box">
          <span id="syncCodeText">${esc(syncCode)}</span>
          <button class="copy-btn" id="copyCodeBtn" title="Copy code">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
        </div>
        <div class="sync-hint">Enter this exact code on another device to pull this same list there. Every change here pushes to the cloud automatically.</div>
        <div id="syncStatusMsg" class="sync-status"></div>
      </div>
      <div class="form-actions" style="margin-top:16px;">
        <button class="delete-link" id="disconnectBtn">Disconnect</button>
        <div style="flex:1"></div>
        <button class="btn btn-outline" id="refreshBtn">Refresh from cloud</button>
      </div>
      <div class="sync-hint" style="margin-top:14px;">Free tier note: this code expires after about 3 months of inactivity. Keep using it and it stays alive.</div>
    `;
    document.getElementById("copyCodeBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(syncCode).then(() => setSyncStatus("ok", "Copied to clipboard"));
    });
    document.getElementById("disconnectBtn").addEventListener("click", disconnectSync);
    document.getElementById("refreshBtn").addEventListener("click", cloudRefresh);
  } else {
    body.innerHTML = `
      <div class="sync-section">
        <div class="sync-hint">Create a code here, then enter that same code on your other device to see the same list everywhere.</div>
        <button class="btn btn-amber full" id="createCodeBtn" style="width:100%;justify-content:center;margin-top:10px;">Create a sync code</button>
      </div>
      <div class="sync-divider">or</div>
      <div class="sync-section">
        <label class="field-label">I already have a code</label>
        <div class="sync-row">
          <input id="connectCodeInput" placeholder="Paste your code">
          <button class="btn btn-ink" id="connectCodeBtn">Connect</button>
        </div>
        <div class="sync-hint">This replaces what's on this device with the list from that code.</div>
      </div>
      <div id="syncStatusMsg" class="sync-status"></div>
    `;
    document.getElementById("createCodeBtn").addEventListener("click", cloudCreateAndConnect);
    document.getElementById("connectCodeBtn").addEventListener("click", () => {
      cloudConnectExisting(document.getElementById("connectCodeInput").value);
    });
  }
}


document.getElementById("searchInput").addEventListener("input", e => { searchTerm = e.target.value; renderGrid(); });
document.getElementById("platformFilter").addEventListener("change", e => { platformFilter = e.target.value; renderGrid(); });
document.getElementById("shuffleBtn").addEventListener("click", pickRandom);
document.getElementById("addBtn").addEventListener("click", () => openForm(null));
document.getElementById("formClose").addEventListener("click", closeForm);
document.getElementById("cancelBtn").addEventListener("click", closeForm);
document.getElementById("saveBtn").addEventListener("click", saveForm);
document.getElementById("deleteBtn").addEventListener("click", deleteCurrent);
document.getElementById("formOverlay").addEventListener("click", e => { if (e.target.id === "formOverlay") closeForm(); });
document.getElementById("gsInput").addEventListener("input", e => runGameSearch(e.target.value));
document.getElementById("pullAgainBtn").addEventListener("click", pickRandom);
document.getElementById("closeRandomBtn").addEventListener("click", () => document.getElementById("randomOverlay").classList.add("hidden"));
document.getElementById("randomOverlay").addEventListener("click", e => { if (e.target.id === "randomOverlay") e.target.classList.add("hidden"); });
document.getElementById("syncPillBtn").addEventListener("click", () => {
  renderSyncModal();
  document.getElementById("syncOverlay").classList.remove("hidden");
});
document.getElementById("syncClose").addEventListener("click", () => document.getElementById("syncOverlay").classList.add("hidden"));
document.getElementById("syncOverlay").addEventListener("click", e => { if (e.target.id === "syncOverlay") e.target.classList.add("hidden"); });

updateSyncPill();
loadGames();
renderAll();
</script>
</body>
</html>
